[project]
name = "materials-harness"
version = "0.1.0"
description = "Validation harness proving a MACE-based materials simulation engine reproduces known results"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymatgen",
    "mp-api",
    "ase",
    "mace-torch",
    "pandas",
    "pyarrow",
    "matplotlib",
    "python-dotenv",
    "tenacity",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:spglib.*"]
markers = [
    "slow: runs MACE relaxations or hits the MP API/cache (deselect with -m 'not slow')",
]
