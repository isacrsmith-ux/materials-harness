name: secret scan

# Hooks are not cloned, so a contributor without scripts/install_hooks.sh run is not covered by
# the pre-commit hook. This workflow runs the same checks on the server, where they cannot be
# skipped with --no-verify.
#
# It requires no secrets, no API key and no model weights: every check reads only the repository
# itself, so it runs on forks and on pull requests from forks.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (tracked content)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # The preflight's history scan walks every object; a shallow clone would make it
          # silently check almost nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run the preflight
        run: ./scripts/preflight_publish.sh

  gitleaks-history:
    name: gitleaks (all commits, all branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan the full history
        # --redact so a finding never prints the secret into a public log.
        # --config pins the allowlist for the one known false positive (see .gitleaks.toml);
        # it extends the default rules rather than replacing them.
        run: gitleaks git --log-opts="--all --full-history" --redact --no-banner --verbose --config .gitleaks.toml
